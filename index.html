<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>
</head>
<body>
    <nav>
        <p>Home</p>
        <p>Detalhes</p>
        <p>Titulo</p>
    </nav>
    <p id="texto-post">biblioteca</p>

    <form id="meu-form">
        <div>
            <label for="email">Digite seu email</label>
            <input type="email" id="email" required>
        </div>
        <div>
            <label for="message">Mande uma mensagem:</label>
            <textarea id="message" required></textarea>
        </div>
        <button type="submit">Send</button>
    </form>

  
    <div id="texto-post"></div>

    <script>
      const form = document.getElementById('meu-form');
      const textoPost = document.getElementById('texto-post');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        textoPost.innerText = "🤖 A IA está pensando...";

       
        const response = await fetch('https://sussmateus.app.n8n.cloud/webhook/a7c70034-31a6-4a81-9adb-bc4365152690', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            message: document.getElementById('message').value
          })
        });

        
        const text = await response.text();

        
        textoPost.innerHTML = marked.parse(text);
      });
    </script>
</body>
</html>
